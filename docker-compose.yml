services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: meterflow
      MYSQL_USER: meterflow
      MYSQL_PASSWORD: meterflow-local
      MYSQL_ROOT_PASSWORD: root-local-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - meterflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  meterflow_mysql:

